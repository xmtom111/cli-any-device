[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-any-device-duet-rrf"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["cli-any-device"]
dynamic = ["optional-dependencies"]

[project.entry-points."cli_any_device.adapters"]
duet_rrf = "adapters.duet_rrf:create_adapter"

[tool.setuptools]
packages = ["adapters.duet_rrf"]

[tool.setuptools.package-dir]
"adapters.duet_rrf" = "."

[tool.setuptools.dynamic.optional-dependencies]
rehearsal = {file = ["requirements.txt"]}
