<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310">
  <defs>
    <linearGradient id="abg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D18"/>
      <stop offset="100%" stop-color="#0E172A"/>
    </linearGradient>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="308" rx="14" fill="url(#abg)" stroke="#1E293B" stroke-width="2"/>

  <!-- Section headers -->
  <text x="36" y="34" fill="#38BDF8" font-family="DM Mono, Cascadia Code, monospace" font-size="12" font-weight="600" letter-spacing="1">BUILD TIME — DECLARATIVE PACK &amp; COMPILER</text>
  <line x1="36" y1="155" x2="1164" y2="155" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="36" y="182" fill="#34D399" font-family="DM Mono, Cascadia Code, monospace" font-size="12" font-weight="600" letter-spacing="1">RUNTIME — SHARED SAFETY KERNEL &amp; PLUGGABLE ADAPTERS (NO FIRMWARE CHANGES)</text>

  <!-- Build time row -->
  <g transform="translate(36, 52)" font-family="DM Sans, DejaVu Sans, sans-serif">
    <rect x="0" y="0" width="235" height="78" rx="10" fill="#101A30" stroke="#253554"/>
    <text x="16" y="28" fill="#F8FAFC" font-size="14.5" font-weight="700">1. Interface + Inputs</text>
    <text x="16" y="50" fill="#94A3B8" font-family="DM Mono, monospace" font-size="11.5">Manual / Python Host API</text>
    <text x="16" y="67" fill="#64748B" font-family="DM Mono, monospace" font-size="10.5">(AST-only, never executed)</text>

    <line x1="241" y1="39" x2="294" y2="39" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="267" y="30" text-anchor="middle" fill="#7DD3FC" font-family="DM Mono, monospace" font-size="10">draft</text>

    <rect x="302" y="0" width="235" height="78" rx="10" fill="#101A30" stroke="#253554"/>
    <text x="318" y="28" fill="#F8FAFC" font-size="14.5" font-weight="700">2. Device Pack (YAML)</text>
    <text x="318" y="50" fill="#38BDF8" font-family="DM Mono, monospace" font-size="11.5">device.yaml + catalog.yaml</text>
    <text x="318" y="67" fill="#64748B" font-family="DM Mono, monospace" font-size="10.5">limits · risks · capabilities</text>

    <line x1="543" y1="39" x2="596" y2="39" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyan)"/>
    <text x="569" y="30" text-anchor="middle" fill="#7DD3FC" font-family="DM Mono, monospace" font-size="10">build</text>

    <rect x="604" y="0" width="245" height="78" rx="10" fill="#101A30" stroke="#0EA5E9" stroke-opacity="0.65"/>
    <text x="620" y="28" fill="#F8FAFC" font-size="14.5" font-weight="700">3. Bundle Compiler</text>
    <text x="620" y="50" fill="#94A3B8" font-family="DM Mono, monospace" font-size="11.5">schema + safety validator</text>
    <text x="620" y="67" fill="#7DD3FC" font-family="DM Mono, monospace" font-size="10.5">--check drift gate for CI</text>

    <line x1="855" y1="39" x2="904" y2="39" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyan)"/>

    <rect x="912" y="0" width="216" height="78" rx="10" fill="#0F2336" stroke="#38BDF8" stroke-opacity="0.7"/>
    <text x="928" y="28" fill="#F8FAFC" font-size="14.5" font-weight="700">4. Generated Artifacts</text>
    <text x="928" y="50" fill="#A5F3FC" font-family="DM Mono, monospace" font-size="11.5">SKILL.md · HOOKUP.md</text>
    <text x="928" y="67" fill="#94A3B8" font-family="DM Mono, monospace" font-size="10.5">cli_schema.json</text>
  </g>

  <!-- Runtime row -->
  <g transform="translate(36, 198)" font-family="DM Sans, DejaVu Sans, sans-serif">
    <rect x="0" y="0" width="244" height="84" rx="10" fill="#0E2022" stroke="#10B981" stroke-opacity="0.55"/>
    <text x="16" y="28" fill="#F8FAFC" font-size="14.5" font-weight="700">cli-device (Thin CLI)</text>
    <text x="16" y="50" fill="#6EE7B7" font-family="DM Mono, monospace" font-size="11">--json · --dry-run · --confirm</text>
    <text x="16" y="69" fill="#94A3B8" font-family="DM Mono, monospace" font-size="10.5">exit codes: 0/1/2/3/4/5/99</text>

    <line x1="250" y1="42" x2="306" y2="42" stroke="#34D399" stroke-width="2" marker-end="url(#arrowEmerald)"/>
    <text x="278" y="33" text-anchor="middle" fill="#6EE7B7" font-family="DM Mono, monospace" font-size="10">Unix IPC</text>

    <rect x="314" y="0" width="362" height="84" rx="10" fill="#0D2624" stroke="#34D399" stroke-width="1.5"/>
    <text x="330" y="28" fill="#F8FAFC" font-size="14.5" font-weight="700">cli-device-d + SafetyKernel</text>
    <text x="330" y="50" fill="#A7F3D0" font-family="DM Mono, monospace" font-size="11">R0–R4 · default deny · bounds · confirm</text>
    <text x="330" y="69" fill="#94A3B8" font-family="DM Mono, monospace" font-size="10.5">await_settled() + postconditions + fail_safe</text>

    <!-- ActionDriver path -->
    <line x1="682" y1="26" x2="782" y2="26" stroke="#34D399" stroke-width="2" marker-end="url(#arrowEmerald)"/>
    <text x="732" y="18" text-anchor="middle" fill="#6EE7B7" font-family="DM Mono, monospace" font-size="10">ActionDriver</text>

    <!-- Out-of-band abort path -->
    <line x1="682" y1="62" x2="782" y2="62" stroke="#F59E0B" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arrowAmber)"/>
    <text x="732" y="54" text-anchor="middle" fill="#FCD34D" font-family="DM Mono, monospace" font-size="10">Lock-Free Abort</text>

    <rect x="790" y="0" width="338" height="84" rx="10" fill="#101A30" stroke="#334155"/>
    <text x="806" y="28" fill="#F8FAFC" font-size="14.5" font-weight="700">adapters/* (Pluggable SPI)</text>
    <text x="806" y="50" fill="#CBD5E1" font-family="DM Mono, monospace" font-size="11">in_memory · mujoco_twin · grbl_sim · duet_rrf</text>
    <text x="806" y="69" fill="#94A3B8" font-family="DM Mono, monospace" font-size="10.5">translates existing protocols only</text>
  </g>
</svg>
