[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cli-any-device"
version = "0.1.0"
description = "Let AI drive all your devices — turn any open-source hardware into a safe, AI-callable CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CLI-Any-Device Contributors" }]
keywords = ["hardware", "automation", "cli", "ai-agents", "scpi", "mcp"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: Utilities",
]
dependencies = [
    "PyYAML>=6.0",
    "click>=8.1",
]

[project.urls]
Homepage = "https://github.com/xmtom111/cli-any-device"
Repository = "https://github.com/xmtom111/cli-any-device"
Issues = "https://github.com/xmtom111/cli-any-device/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.11",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
cli-device = "cli.main:main"
cli-device-d = "daemon.main:main"

[project.entry-points."cli_any_device.adapters"]
duet_rrf = "adapters.duet_rrf:create_adapter"
mujoco_twin = "adapters.mujoco_twin:create_adapter"
grbl_sim = "adapters.grbl_sim:create_adapter"
scpi_generic = "adapters.scpi_generic:create_adapter"
http_json = "adapters.http_json:create_adapter"
moonraker_http = "adapters.moonraker_http:create_adapter"

[tool.hatch.build.targets.sdist]
only-include = [
    "adapter_spi",
    "adapters",
    "bundles",
    "cli",
    "compiler",
    "core_types",
    "daemon",
    "docs",
    "safety_kernel",
    "skills",
    "tests",
]

[tool.hatch.build.targets.wheel]
packages = [
    "core_types",
    "adapter_spi",
    "compiler",
    "safety_kernel",
    "daemon",
    "cli",
    "adapters",
]

[tool.hatch.build.targets.wheel.force-include]
"skills/cli-any-device-onboard/SKILL.md" = "cli/cli-any-device-onboard/SKILL.md"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
packages = [
    "core_types",
    "adapter_spi",
    "compiler",
    "safety_kernel",
    "daemon",
    "cli",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [
    "core_types",
    "adapter_spi",
    "compiler",
    "safety_kernel",
    "daemon",
    "cli",
    "tests",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = [
    "core_types",
    "adapter_spi",
    "compiler",
    "safety_kernel",
    "daemon",
    "cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
